services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: budgetmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgetmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Budget Mate Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetmate-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/budgetmate
      JWT_SECRET: development-jwt-secret-key-123456789
      JWT_REFRESH_SECRET: development-refresh-secret-987654321
      JWT_EXPIRE: 24h
      JWT_REFRESH_EXPIRE: 7d
      PORT: 5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # Budget Mate Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budgetmate-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_APP_NAME: Budget Mate
      VITE_DEMO_MODE: false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
